name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Créer le projet Android
        run: |
          flutter create --platforms=android --project-name baobab_digital --org com.baobabdigital .
          rm -rf test

      - name: Installer les paquets
        run: flutter pub get

      - name: Icône de l’application
        run: dart run flutter_launcher_icons

      - name: Nom de l’application
        run: sed -i 's/android:label="[^"]*"/android:label="Baobab Digital"/' android/app/src/main/AndroidManifest.xml

      - name: Construire l’APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: baobab-digital-apk
          path: build/app/outputs/flutter-apk/app-release.apk
